<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7cf7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c5cbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4db8a4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="url(#shine)" opacity="0.3"/>
  <!-- R letter stylized -->
  <text x="256" y="320" font-family="system-ui, sans-serif" font-size="260" font-weight="700" fill="white" text-anchor="middle" opacity="0.95">R</text>
  <!-- Subtle brain/mind arc -->
  <path d="M160 180 Q256 100 352 180" stroke="rgba(255,255,255,0.5)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="160" cy="180" r="6" fill="rgba(255,255,255,0.6)"/>
  <circle cx="352" cy="180" r="6" fill="rgba(255,255,255,0.6)"/>
</svg>